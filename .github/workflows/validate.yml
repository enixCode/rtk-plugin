name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate JSON files
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          status=0
          for f in **/*.json; do
            echo "::group::$f"
            if ! jq empty "$f"; then status=1; fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Validate plugin manifest required fields
        run: jq -e 'has("name") and has("version") and has("description")' .claude-plugin/plugin.json

      - name: Validate hooks.json shape
        run: jq -e '.hooks.PreToolUse and .hooks.SessionStart' hooks/hooks.json

  dispatch-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Smoke test dispatch passthrough (no RTK binary)
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_PLUGIN_ROOT="$PWD"
          export CLAUDE_PLUGIN_DATA="$(mktemp -d)"

          expect_passthrough() {
            local cmd="$1"
            local out
            out=$(jq -n --arg cmd "$cmd" '{tool_input:{command:$cmd}}' | node bin/dispatch.mjs)
            [ -z "$out" ] || { echo "expected passthrough for: $cmd, got: $out"; exit 1; }
            echo "ok: $cmd"
          }

          expect_passthrough "git status"
          expect_passthrough "git status | head"
          expect_passthrough "echo hi && ls"
          expect_passthrough "whoami"
          expect_passthrough "rtk git status"
          expect_passthrough "make build"
          expect_passthrough "mvn install"

      - name: Smoke test dispatch rewrite (mock RTK binary present)
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_PLUGIN_ROOT="$PWD"
          export CLAUDE_PLUGIN_DATA="$(mktemp -d)"
          mkdir -p "$CLAUDE_PLUGIN_DATA/rtk"
          if [ "$RUNNER_OS" = "Windows" ]; then
            : > "$CLAUDE_PLUGIN_DATA/rtk/rtk.exe"
          else
            : > "$CLAUDE_PLUGIN_DATA/rtk/rtk"
            chmod +x "$CLAUDE_PLUGIN_DATA/rtk/rtk"
          fi

          expect_rewrite() {
            local cmd="$1"
            local out
            out=$(jq -n --arg cmd "$cmd" '{tool_input:{command:$cmd}}' | node bin/dispatch.mjs)
            echo "$out" | jq -e '.hookSpecificOutput.updatedInput.command | test("rtk(\\.exe)?")' >/dev/null \
              || { echo "expected rewrite for: $cmd, got: $out"; exit 1; }
            echo "ok-rewrite: $cmd"
          }

          expect_passthrough() {
            local cmd="$1"
            local out
            out=$(jq -n --arg cmd "$cmd" '{tool_input:{command:$cmd}}' | node bin/dispatch.mjs)
            [ -z "$out" ] || { echo "expected passthrough for: $cmd, got: $out"; exit 1; }
            echo "ok-pass: $cmd"
          }

          # Rewrites: plain + IO redirections must reach RTK.
          expect_rewrite "git status"
          expect_rewrite "ls -la /tmp"
          expect_rewrite "git log 2>&1"
          expect_rewrite "git status 2>/dev/null"
          expect_rewrite "git log > out.txt"
          expect_rewrite "git log >> out.txt"
          expect_rewrite "cat <<EOF"
          expect_rewrite "grep foo <<<bar"

          # Passthroughs: real chaining + already-wrapped + non-tool.
          expect_passthrough "git status | head"
          expect_passthrough "git add . && git commit"
          expect_passthrough "git pull || echo fail"
          expect_passthrough "ls; pwd"
          expect_passthrough "git log \$(whoami)"
          expect_passthrough "rtk git status"
          expect_passthrough "/usr/bin/rtk git status"
          expect_passthrough "\"C:\\rtk.exe\" git status"
          expect_passthrough "whoami"
